name: my-cs2-server
game: cs2
runtime: docker

docker:
  image: joedwards32/cs2:latest
  container_name: cs2
  volumes:
    - /mnt/data/cs2:/home/user/cs2
  env:
    CS2_SERVERNAME: "My CS2 Server"
    CS2_CHEATS: "0"
    CS2_PORT: "27015"
    CS2_MAXPLAYERS: "10"
    CS2_GAMETYPE: "0"
    CS2_GAMEMODE: "1"
    CS2_MAPGROUP: "mg_active"
    CS2_STARTMAP: "de_dust2"
    CS2_RCON_PORT: "27015"
    RCON_PASSWORD: "changeme"
  stop_timeout: 15

service:
  name: cs2

console:
  type: rcon
  rcon:
    address: "127.0.0.1:27015"
    password: "changeme"

backup:
  dirs:
    - cfg
    - maps
  archive_format: tar.gz
  backend: s3
  s3:
    bucket: my-gameserver-backups
    prefix: cs2/
    region: us-east-1

update:
  type: image
  image:
    prune: true

ports:
  - { name: game,  port: 27015, protocol: udp }
  - { name: rcon,  port: 27015, protocol: tcp }
